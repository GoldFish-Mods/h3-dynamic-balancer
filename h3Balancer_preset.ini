; ==============================================================================
; BALANCER CONFIGURATION PRESET   /  ПРЕСЕТ НАСТРОЕК БАЛАНСИРОВЩИКА
; Backup is automatically saved to Runtime/h3Balancer_preset.ini
; After making changes to this config, type "bal conf" in the in-game chat to apply settings
; -------------------------------------------------------------------------------
; Резервная копия автоматически сохраняется в Runtime/h3Balancer_preset.ini
; После внесения изменений в данный конфиг введите в игровой чат команду "bal conf" для применения настроек
; ==============================================================================


[difficulty]

; Balancing activation delay (in game days)
; ------------------------------
; Задержка запуска балансировки в днях
startFromDay = 10

; Manual power balance bias (-100..+100)
; -100 heavily favors player; +100 heavily favors AI
; ------------------------------
; Ручная корректировка перевеса сил (-100..+100)
; -100 максимум помощи игроку; +100 максимум помощи ИИ
adjustmentAmount = 0


[smoothing]

; Balance response rate when power advantage grows (1..100%)
; The lower the %, the smoother the adaptation without sudden jumps; the higher the %, the harsher the game balances
; ------------------------------
; Скорость реакции баланса при росте перевеса сил (1..100%)
; Чем меньше %, тем мягче адаптация без резких скачков; чем больше %, тем жестче игра балансирует
emaGrowthPct = 45

; Balance recovery rate when power advantage decreases (1..100%)
; The lower the %, the smoother the penalties fade; the higher the %, the faster the game returns to normal
; ------------------------------
; Скорость реакции баланса при снижении перевеса сил (1..100%)
; Чем меньше %, тем плавнее спадают штрафы; чем больше %, тем быстрее игра возвращается к норме
emaDecayPct = 75

; Instant snap threshold for balance convergence (0..100 points)
; Higher threshold bypasses smoothing sooner and applies the target value immediately
; ------------------------------
; Порог мгновенной доводки баланса (в пунктах 0..100)
; Чем выше порог, тем раньше игра отсекает плавный набор и выставляет значение сразу
emaSnapThreshold = 5


[aiResourceModifiers]

; Safety stockpile threshold (excluding gold) immune to harsh income penalties
; ------------------------------
; Минимальный запас ресурсов (кроме золота), до которого не действуют жесткие штрафы на доход
minResForReduce = 15